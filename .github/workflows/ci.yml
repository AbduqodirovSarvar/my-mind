name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore MyMind.slnx
      # TreatWarningsAsErrors + NuGetAudit: a vulnerable package fails the build.
      - run: dotnet build MyMind.slnx --no-restore -c Release
      - run: dotnet format MyMind.slnx --no-restore --verify-no-changes
      - run: dotnet test --solution MyMind.slnx --no-build -c Release

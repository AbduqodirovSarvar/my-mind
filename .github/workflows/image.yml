name: Image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Image names must be lowercase; the GitHub owner name may not be.
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MyMind.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/mymind-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/mymind-api:latest
